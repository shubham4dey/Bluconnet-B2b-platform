# Railway Configuration for B2B Lead Platform
# Deploy: https://railway.app/deploy

[build]
  builder = "DOCKERFILE"

[deploy]
  startCommand = "npm start"
  healthcheckPath = "/api/health"
  healthcheckTimeout = 300
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 10

[[services]]
  name = "backend"
  source = "./server"
  
  [services.env]
    NODE_ENV = "production"
    PORT = "4000"
  
  [[services.ports]]
    port = 4000
    protocol = "http"

[[services]]
  name = "frontend"
  source = "./client"
  
  [services.env]
    VITE_API_URL = "${{backend.url}}"
  
  [[services.ports]]
    port = 80
    protocol = "http"
